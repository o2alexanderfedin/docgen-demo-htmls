remote_theme: pages-themes/cayman@v0.2.0
title: LLM Gateway Documentation
description: Complete documentation for LLM Gateway product
markdown: GFM
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-readme-index
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings
relative_links:
  enabled: true
  collections: true
include:
  - README.md
  - "**/*.md"
exclude:
  - .gitignore

permalink: pretty
optional_front_matter:
  remove_originals: true
readme_index:
  enabled: true
  remove_originals: true
titles_from_headings:
  enabled: true
  strip_title: true
  collections: true
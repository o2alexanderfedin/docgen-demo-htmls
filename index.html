<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>LLM Gateway Documentation</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
  <style>
    body { padding: 20px; }
    .nav-link { cursor: pointer; }
    .content { margin-top: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>LLM Gateway Documentation</h1>
    <p>View any documentation page with rendered diagrams:</p>
    
    <div class="input-group mb-3">
      <input type="text" id="fileUrl" class="form-control" placeholder="Enter GitHub file URL" 
        value="https://github.com/o2alexanderfedin/docgen-demo-htmls/blob/master/llm-gateway-technical-architecture/system-architecture-overview.md">
      <button class="btn btn-primary" id="loadButton">View Rendered</button>
    </div>

    <div class="content border p-4">
      <div id="markdownContent"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({
      startOnLoad: false,
      theme: 'default',
      securityLevel: 'loose'
    });

    document.getElementById('loadButton').addEventListener('click', function() {
      const url = document.getElementById('fileUrl').value;
      
      // Convert GitHub URL to raw URL
      let rawUrl = url;
      if (url.includes('github.com')) {
        rawUrl = url
          .replace('github.com', 'raw.githubusercontent.com')
          .replace('/blob/', '/');
      }
      
      fetch(rawUrl)
        .then(response => response.text())
        .then(markdown => {
          const contentDiv = document.getElementById('markdownContent');
          
          // Process Mermaid code blocks
          let processedMarkdown = markdown.replace(/```mermaid([\s\S]*?)```/g, function(match, p1) {
            const id = 'mermaid-' + Math.random().toString(36).substring(2, 10);
            return `<div class="mermaid" id="${id}">${p1}</div>`;
          });
          
          // Render markdown
          contentDiv.innerHTML = marked.parse(processedMarkdown);
          
          // Initialize Mermaid diagrams
          setTimeout(() => {
            mermaid.init(undefined, '.mermaid');
          }, 500);
        })
        .catch(error => {
          console.error('Error loading markdown:', error);
          document.getElementById('markdownContent').innerHTML = 
            '<div class="alert alert-danger">Error loading document. Please check the URL.</div>';
        });
    });

    // Load the default page on startup
    document.getElementById('loadButton').click();
  </script>
</body>
</html>
